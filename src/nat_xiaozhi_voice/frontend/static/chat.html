<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>小智语音对话</title>
  <link rel="stylesheet" href="/chat.css">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <h1>小智语音对话</h1>
        <p id="statusText" class="status-text">正在检查服务...</p>
      </div>
      <div class="toolbar" aria-label="对话控制">
        <label class="toggle">
          <input id="autoPlayToggle" type="checkbox" checked>
          <span>自动播放</span>
        </label>
        <button id="interruptButton" class="secondary-button danger-button" type="button" disabled>打断</button>
        <button id="replayButton" class="secondary-button" type="button" disabled>重播</button>
      </div>
    </header>

    <section class="device-row" aria-label="设备设置">
      <label for="deviceIdInput">设备 ID</label>
      <input id="deviceIdInput" class="device-input" type="text" spellcheck="false">
      <button id="saveDeviceButton" class="secondary-button" type="button">保存</button>
    </section>

    <section id="messageList" class="message-list" aria-live="polite" aria-label="对话内容">
      <div class="empty-state">
        <strong>准备好了。</strong>
        <span>输入文字，或点击“开始说话”和小智对话。</span>
      </div>
    </section>

    <form id="composerForm" class="composer">
      <div class="composer-main">
        <div class="composer-status" aria-live="polite">
          <div class="meter" aria-hidden="true"><span id="volumeMeter"></span></div>
          <span id="voiceStatus">点击“开始说话”录音，或输入文字。</span>
        </div>
        <textarea id="messageInput" rows="2" placeholder="输入消息，或点击右侧按钮说话..." autocomplete="off"></textarea>
      </div>
      <div class="composer-actions">
        <button id="voiceButton" class="voice-button" type="button">开始说话</button>
        <button id="sendButton" class="primary-button" type="submit">发送文字</button>
      </div>
    </form>
  </main>

  <script src="/chat.js"></script>
</body>
</html>
